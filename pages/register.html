<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crear cuenta en Kickora, tienda de zapatillas urbanas y deportivas."
    />
    <meta name="author" content="RollingCode" />
    <link rel="icon" type="image/png" href="../img/favicon/favicon.png" />

    <title>Registrarse | Kickora</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../css/auth.css" />
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-container">
        <!-- Lado izquierdo con imagen -->
        <div class="auth-image-side">
          <div class="auth-image-overlay">
            <a href="./index.html" class="auth-logo">Kickora</a>

            <div class="auth-image-content">
              <span class="auth-badge">Nueva cuenta</span>
              <h1>Sumate a la comunidad Kickora.</h1>
              <p>
                Creá tu cuenta y descubrí zapatillas pensadas para tu estilo,
                tus looks y tu día a día.
              </p>
            </div>
          </div>
        </div>

        <!-- Lado derecho con formulario -->
        <div class="auth-form-side">
          <div class="auth-card register-card">
            <a href="./index.html" class="auth-mobile-logo">Kickora</a>

            <div class="auth-header">
              <h2>Crear cuenta</h2>
              <p>Completá tus datos para registrarte.</p>
            </div>

            <form class="auth-form">
              <div class="form-group">
                <label for="name">Nombre completo</label>
                <div class="input-wrapper">
                  <i class="bi bi-person"></i>
                  <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Tu nombre"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrapper">
                  <i class="bi bi-envelope"></i>
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="ejemplo@correo.com"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                  <i class="bi bi-lock"></i>
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Creá una contraseña"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <div class="input-wrapper">
                  <i class="bi bi-shield-lock"></i>
                  <input
                    type="password"
                    id="confirm-password"
                    class="form-control"
                    placeholder="Repetí tu contraseña"
                    required
                  />
                </div>
              </div>

              <div class="auth-options">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms"
                    required
                  />
                  <label class="form-check-label" for="terms">
                    Acepto los términos
                  </label>
                </div>

                <a href="./error404.html" class="forgot-link"
                  >¿Olvidaste tu contraseña?</a
                >
              </div>

              <button type="submit" class="btn auth-btn">Registrarme</button>
            </form>

            <div class="auth-separator">
              <span>o</span>
            </div>

            <button class="btn google-btn" type="button">
              <i class="bi bi-google"></i>
              Registrarme con Google
            </button>

            <p class="auth-change">
              ¿Ya tenés cuenta?
              <a href="./login.html">Iniciar sesión</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
